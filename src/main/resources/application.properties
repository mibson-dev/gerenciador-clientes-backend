spring.application.name=cadastro-clientes

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}

# Chave exigida no header X-Chave-Mestra para criar empresas.
# Se ficar vazia, o cadastro de empresas fica desativado.
app.chave-mestra=${CHAVE_MESTRA:}

# Origens que podem chamar a API (separadas por virgula). Aceita curinga de porta.
app.cors.origens=${CORS_ORIGENS:http://localhost:*,http://127.0.0.1:*}

# Admin de demonstracao. So e criado se a senha estiver definida e o banco estiver vazio.
app.demo.admin-email=${DEMO_ADMIN_EMAIL:admin@demo.com}
app.demo.admin-senha=${DEMO_ADMIN_SENHA:}